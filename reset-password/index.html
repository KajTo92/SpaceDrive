<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Space Drive</title><link rel="stylesheet" href="../styles.css"></head><body class="login-page"><main class="login-main"><section class="login-intro"><p class="eyebrow">Account security</p><h1>Choose a new password</h1></section><section class="login-panel"><form class="login-form" data-reset-form><label class="field"><span>New password</span><input name="password" type="password" minlength="8" required></label><label class="field"><span>Confirm password</span><input name="confirmPassword" type="password" minlength="8" required></label><button class="primary-button login-submit">Update password</button></form><p class="login-message" data-reset-message></p></section></main><script type="module">import{ supabase }from"../shared/supabase-client.js";const f=document.querySelector("[data-reset-form]"),m=document.querySelector("[data-reset-message]");f.addEventListener("submit",async e=>{e.preventDefault();const d=new FormData(f);if(d.get("password")!==d.get("confirmPassword")){m.textContent="Passwords do not match.";return;}const{error}=await supabase.auth.updateUser({password:d.get("password")});m.textContent=error?error.message:"Password updated. You can now sign in.";if(!error)setTimeout(()=>location.href="../login.html",1200);});</script></body></html>
