<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090909" />
    <meta name="description" content="Login to track your Space Drive journey." />
    <title>Ride tracking | Space Drive</title>
    <link rel="icon" href="spacedrive-monogram.png" type="image/png" />
    <script>try{if(sessionStorage.getItem("spacedrive-login-transition")==="1"){sessionStorage.removeItem("spacedrive-login-transition");document.documentElement.classList.add("login-arrival");}}catch{}</script>
    <link rel="stylesheet" href="styles.css?v=31" />
  </head>
  <body class="login-page">
    <header class="site-header is-solid" data-header>
      <a class="brand-mark" href="index.html" aria-label="Space Drive home"><img src="spacedrive-monogram-header.png" alt="" width="426" height="640" /><span>Space Drive</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primaryNav" data-menu-toggle><span class="menu-line"></span><span class="menu-line"></span><span class="sr-only">Menu</span></button>
      <nav class="primary-nav" id="primaryNav" aria-label="Primary navigation">
        <a href="info.html" data-i18n="navInfo">Info</a><a class="nav-cta" href="index.html#booking" data-i18n="navBook">Book a ride</a>
        <div class="language-switch" aria-label="Language"><button class="lang-button is-active" type="button" data-lang="en">EN</button><button class="lang-button" type="button" data-lang="de">DE</button></div>
      </nav>
    </header>
    <main class="login-main">
      <section class="login-intro" aria-labelledby="loginTitle">
        <p class="eyebrow" data-i18n="loginEyebrow">Ride tracking</p>
        <h1 id="loginTitle" data-i18n="loginHeadline">Welcome back</h1>
        <p data-i18n="loginIntro">Sign in to view your ride details and live status.</p>
      </section>
      <section class="login-panel" aria-label="Login">
        <form class="login-form" data-login-form>
          <label class="field"><span data-i18n="emailLabel">Email address</span><input name="email" type="email" autocomplete="email" placeholder="you@example.com" required /></label>
          <label class="field"><span data-i18n="passwordLabel">Password</span><input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required /></label>
          <button class="primary-button login-submit" type="submit"><span>Login</span></button>
          <a class="login-demo-link" href="register/">Create an account</a><a class="login-demo-link" href="#" data-forgot-password>Forgot password?</a>
        </form>
        <p class="login-message" data-login-message aria-live="polite"></p>
      </section>
    </main>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><script type="module" src="app.js?v=17"></script><script type="module" src="login.js?v=8"></script>
  </body>
</html>
