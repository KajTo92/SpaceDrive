<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver application | Space Drive</title><link rel="stylesheet" href="../../styles.css?v=24"><link rel="icon" href="../../spacedrive-monogram.png"></head><body class="login-page"><header class="site-header is-solid"><a class="brand-mark" href="../../"><img src="../../spacedrive-monogram-header.png" alt=""><span>Space Drive</span></a></header><main class="login-main"><section class="login-intro"><p class="eyebrow">Driver application</p><h1>Drive with Space Drive</h1><p>Registration creates a passenger account first. Driver access starts only after dispatch approval.</p></section><section class="login-panel"><form class="login-form" data-register-form="driver"><label class="field"><span>First name</span><input name="firstName" required autocomplete="given-name"></label><label class="field"><span>Last name</span><input name="lastName" required autocomplete="family-name"></label><label class="field"><span>Email</span><input name="email" type="email" required autocomplete="email"></label><label class="field"><span>Phone</span><input name="phone" type="tel" required autocomplete="tel"></label><label class="field"><span>Languages</span><input name="languages" required placeholder="German, English"></label><label class="field"><span>Application note</span><textarea name="applicationNote" rows="3"></textarea></label><label class="field"><span>Password</span><input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label class="field"><span>Confirm password</span><input name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></label><button class="primary-button login-submit" type="submit">Submit driver application</button><a class="login-demo-link" href="../../login.html">Back to login</a></form><p class="login-message" data-register-message aria-live="polite"></p></section></main><script type="module" src="../../shared/register.js"></script></body></html>
